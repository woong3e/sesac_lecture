<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axios</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <script>
      const API_URL = 'https://jsonplaceholder.typicode.com/users/1';
      /* Axios : JS에서 HTTP 요청을 보내기 위한 외부 라이브러리
      fetch 와 다르게 브라우저에 기본 내장되어 있지 않아 별도로 설치를 해야 한다.
      */

      async function callApiWithFetch() {
        try {
          const response = await fetch(API_URL);

          if (!response.ok) {
            throw new Error('error');
          } // 이 코드가 없으면 404, 500 같은 HTTP 에러가 나도 자동으로 catch로 가지 않는다.

          const data = await response.json();
          console.log(data);
        } catch (error) {
          console.error('fetch error', error);
        }
      }

      async function callApiWithAxios() {
        try {
          // .get() , .post() 등 직관적인 메서드 사용으로 가독성이 좋다.
          const response = await axios.get(API_URL);
          console.log(response);
          const data = response.data;
          // json 파싱이 자동으로 되어 response.data에 담겨있다.
        } catch (error) {
          // axios 는 4xx,5xx HTTP 에러를 자동으로 reject 처리하므로
          // catch 에서 바로 잡을 수 있다.
          console.error(error);
        }
      }
      //   callApiWithFetch();
      callApiWithAxios();
    </script>
  </body>
</html>
