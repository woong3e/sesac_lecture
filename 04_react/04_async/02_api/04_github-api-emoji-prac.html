<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>template</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/@babel/standalone/babel.min.js"
    ></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect } = React;

      // 사용자의 입력을 받아, '검색' 이벤트가 발생했음을 부모에게 알린다.
      // 자신이 무엇을 검색하는지 모른다. (오직 부모에게 전달만 할 뿐)
      function SearchBox({ setKeyword, handleClick }) {
        return (
          <>
            <input
              type="text"
              onChange={(e) => {
                setKeyword(e.target.value);
              }}
            />
            <button>검색하기</button>
          </>
        );
      }

      // 부모가 주는 상태(loading, imgUrl)에 따라 화면을 다르게 보여준다.
      // 로딩 중인지, 이미지가 잇는지 없는지 스스로 판단하지 않는다.
      function ImageBox() {
        return (
          <>
            {true ? (
              <img src="https://github.githubassets.com/images/icons/emoji/unicode/1f948.png?v8" />
            ) : (
              <div>이모지를 검색해주세요(결과없음)</div>
            )}
          </>
        );
      }
      // 모든 데이터와 상태(로딩, 전체 이모지 목록, 검색 결과 URL)를 관리한다.
      // API 통신을 책임지고, 자식들의 행동에 따라 상태를 업데이트 한다.
      function App() {
        const [keyword, setKeyword] = useState('');
        const [isLoading, setIsLoading] = useState(false);
        const [emojiList, setEmojiList] = useState([]);
        const emojiURL = 'https://api.github.com/emojis';

        useEffect(() => {
          const requestEmoji = async () => {
            const response = await axios.get(emojiURL);
            const data = response.data;
            setEmojiList(data);
          };
          requestEmoji();
        }, []);

        const imgURL = emojiList?.[keyword];
        const handleClick = () => {
          return imgURL;
        };

        return (
          <>
            <h1>이모지 검색기</h1>
            {/* '무엇을 할지'가 아닌 어떻게 '해야하는지(함수)'를 알려준다. */}
            <SearchBox setKeyword={setKeyword} handleClick={handleClick} />
            <br />
            {/* 자식에게는 현재 '상태(로딩중,에러, imgURL)'만 알려준다 */}
            <ImageBox keyword={keyword} isLoading={isLoading} imgURL={imgURL} />
          </>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
