<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promise</title>
  </head>
  <body>
    <h1>콘솔을 확인하세요.</h1>
    <script>
      /* Promise : 아직 끝나지 않은 비동기 작업의 미래 결과를 나타내는 객체
        비동기 작업의 결과를 담는 객체
        대기(pending), 성공(fulfilled), 실패(rejected) 상태 중 하나를 가진다.

        */
      function increase(number) {
        const promise = new Promise((resolve, reject) => {
          setTimeout(() => {
            const result = number + 10;

            if (result > 30) {
              const e = new Error('숫자가 너무 크다.');
              return reject(e);
            }
            resolve(result); // .then 매개변수로 전달된다.
          }, 1000);
        });

        return promise;
      }
      console.log('작업 시작');
      increase(0)
        .then((number) => {
          console.log(number);
          return increase(number);
        })
        .then((number) => {
          console.log(number);
          return increase(number);
        })
        .then((number) => {
          console.log(number);
          return increase(number);
        })
        .catch((error) => {
          // .then 체인 중간에 reject 하면 여기서 잡힌다.
          console.log(error);
        })
        .finally(() => {
          // 성공, 실패에 관계없이 무조건 실행
          console.log('모든 작업이 끝났습니다.');
        });
    </script>
  </body>
</html>
