<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01_rendering-list</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/@babel/standalone/babel.min.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const fruits = ['🍎', '🍌', '🍇', '🍐'];

      function FruitList() {
        return (
          <>
            <h2>과일 목록</h2>
            <ul>
              {fruits.map((fruit, index) => {
                return <li key={index}>{fruit}</li>;
              })}
            </ul>
          </>
        );
      }

      // 객체 배열 기반 리스트 렌더링
      const users = [
        { id: 1, name: '박지성' },
        { id: 2, name: '손흥민' },
        { id: 3, name: '차범근' },
      ];

      function UserList() {
        return (
          <>
            <h2>회원 목록</h2>
            <ul>
              {/* key: 리액트가 리스트를 렌더링할 때 각 항목을 구분할수 있게 도와주는 고유한 값 */}
              {users.map((user) => {
                return <li key={user.id}>{user.name}</li>;
              })}
            </ul>
          </>
        );
      }

      function App() {
        return (
          <>
            <FruitList />
            <UserList />
          </>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
