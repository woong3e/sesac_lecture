<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>useState</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/@babel/standalone/babel.min.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React; // 객체 구조 분해 할당
      // useState 호출: [상태 값, 상태 변경 함수] = useState('초기값');
      // 배열구조분해할당
      /*
        useState Hook
        - Hook : 함수형 컴포넌트가 React의 기능을 사용할 수 있게 연결해주는 함수이다.
        - 함수형 컴포넌트에서 State를 사용할 수 있게 해주는 함수이다.

        props: 부모가 전달, 자식이 직접 수정하지 않음
        state: 컴포넌트 내부에서 관리, setter로 변경
      */
      function MessageManager() {
        const [message, setMessage] = useState('초기 상태 메시지입니다.');
        const [textColor, setTextColor] = useState('black');

        // 상태 변경 함수(Setter)를 호출하면 -> 컴포넌트가 '리렌더링'된다.
        // 컴포넌트 함수가 다시 실행되면서 변경된 state 값으로 JSX가 다시 만들어진다.
        console.log('MessageManager 컴포넌트가 렌더링됐다.');
        const handleEnter = () => {
          setMessage('안녕하세요 환영합니다.');
          setTextColor('tomato');
        };

        const handleLeave = () => {
          setMessage('안녕히 가세요 다음에 또 만나요.');
          setTextColor('blue');
        };

        return (
          <>
            <h1>함수형 컴포넌트 (useState)</h1>
            <h2 style={{ color: textColor }}>{message}</h2>
            <button onClick={handleEnter}>입장</button>
            <button onClick={handleLeave}>퇴장</button>
          </>
        );
      }

      function Counter() {
        const [count, setCount] = useState(0);

        // 함수형 업데이트: 이전 상태 값을 안전하게 사용하기
        // setter 함수의 매개변수 prev에는 리액트가 관리하는 최신 이전 상태값이 들어온다.
        // 같은 이벤트 안에서 이전 state를 기준으로 연속 계산해야 한다면 이 방식을 사용한다.
        const increaseByTwo = () => {
          setCount((prev) => prev + 1);
          setCount((prev) => prev + 1);
        };
        return (
          <>
            <h1>함수형 컴포넌트 카운터</h1>
            <h2>현재 숫자: {count}</h2>
            <button
              onClick={() => {
                setCount(count + 1);
              }}
            >
              더하기 +1
            </button>
            <button
              onClick={() => {
                setCount(count - 1);
              }}
            >
              빼기 -1
            </button>
            <button
              onClick={() => {
                // 두 줄 모두 현재 렌더링 시점의 같은 count 값을 기준으로 계산한다.
                // 리액트는 상태 변경을 모아서 처리하기 때문에, 의도한 +2가 아니라 +1로 동작한다.
                setCount(count + 1);
                setCount(count + 1);
              }}
            >
              더하기 +2(의도대로 작동x)
            </button>
            <button onClick={increaseByTwo}>더하기 +2(의도대로 작동o)</button>
          </>
        );
      }

      function CustomButton({ onClick, children }) {
        console.log();
        return (
          <>
            <button
              onClick={onClick}
              style={{
                backgroundColor: 'black',
                color: 'whitesmoke',
                border: 'none',
                padding: '3px',
              }}
            >
              {children}
            </button>
          </>
        );
      }

      function App() {
        const showWelcomeMessage = () => {
          alert('우리 사이트에 오신 것을 환영합니다');
        };
        return (
          <>
            <MessageManager />
            <hr />
            <Counter />
            <hr />
            <CustomButton onClick={showWelcomeMessage}>
              <strong>환영 메세지</strong>
            </CustomButton>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
