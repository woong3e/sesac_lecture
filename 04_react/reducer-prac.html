<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>useReducer-prac</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/@babel/standalone/babel.min.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useReducer, useState } = React;

      function CountWithReducer() {
        const reducer = (number, action) => {
          switch (action.type) {
            case 'PLUS1':
              return number + 1;

            case 'MULTI4':
              return number * 4;

            case 'DIVIDE3':
              return number / 3;

            default:
              return number;
          }
        };
        const intialState = 0;
        const [number, dispatch] = useReducer(reducer, intialState);

        return (
          <>
            <button onClick={() => dispatch({ type: 'PLUS1' })}>
              더하기 1
            </button>
            <button onClick={() => dispatch({ type: 'MULTI4' })}>
              곱하기 4
            </button>
            <button onClick={() => dispatch({ type: 'DIVIDE3' })}>
              나누기 3
            </button>
            <h1>{number}</h1>
          </>
        );
      }

      function CountWithUseState() {
        const [number, setNumber] = useState(0);
        const plus1 = () => {
          setNumber(number + 1);
        };
        const multi4 = () => {
          setNumber(number * 4);
        };
        const divi3 = () => {
          setNumber(number / 3);
        };
        return (
          <>
            <button onClick={plus1}> 더하기 1</button>
            <button onClick={multi4}>곱하기 4</button>
            <button onClick={divi3}>나누기 3</button>
            <h1>{number}</h1>
          </>
        );
      }

      function Cart() {}

      function App() {
        return (
          <>
            <h1> useReducer</h1>
            <CountWithReducer />
            <hr />
            <h1> useState</h1>
            <CountWithUseState />
          </>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
