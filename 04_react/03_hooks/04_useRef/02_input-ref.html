<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>useRef-input-ref</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/@babel/standalone/babel.min.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function LoginComponent() {
        const [form, setForm] = useState({
          username: '',
          password: '',
        });
        const usernameRef = useRef();

        /* 렌더링이 끝나기 전에는 실제 DOM 요소가 아직 준비되지 않았을 수 있으므로
            DOM을 직접 다루는 코드는 useEffect 안에서 처리하는 것이 자연스럽다. */

        /* DOM 요소 직접 접근, 렌더링과 무관한 값을 저장할 때. */

        useEffect(() => {
          console.log('Login 컴포넌트가 마운트 됐다.');
          console.log(usernameRef.current);
          usernameRef.current.focus();
        }, []);

        const onChangeHandler = (e) => {
          setForm({ ...form, [e.target.name]: e.target.value });
        };

        const onClickHandler = (e) => {
          alert(`username: ${form.username}, password: ${form.password}`);
          setForm({ username: '', password: '' });
          usernameRef.current.focus();
        };

        /*
        input 태그의 ref 속성에 usernameRef 를 연결하면
        React가 렌더링 후 usernameRef.current 에 해당 input DOM 요소를 넣어준다.
        */

        return (
          <>
            <input
              type="text"
              name="username"
              placeholder="아이디 입력"
              value={form.username}
              onChange={onChangeHandler}
              ref={usernameRef}
            />
            <br />
            <input
              type="password"
              name="password"
              placeholder="패스워드 입력"
              value={form.password}
              onChange={onChangeHandler}
            />
            <br />
            <button onClick={onClickHandler}>로그인</button>
          </>
        );
      }

      function App() {
        return (
          <>
            <LoginComponent />
          </>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
