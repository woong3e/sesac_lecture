<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>useMemo-reference</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/@babel/standalone/babel.min.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      function App() {
        const [isKorea, setIsKorea] = useState(true);
        const [number, setNumber] = useState(0);
        console.log('🚀🚀🚀렌더링🚀🚀🚀');

        const location = useMemo(() => {
          return { country: isKorea ? '한국' : '외국' };
        }, [isKorea]);

        useEffect(() => {
          console.log('useEffect 호출 location이 변경됐다.');
        }, [location]);

        // console.log({ country: '한국' } === { country: '한국' });

        return (
          <>
            <h2>지금 당신이 있는 위치는?</h2>
            <p>국가 : {location.country}</p>
            <button onClick={(e) => setIsKorea((prev) => !prev)}>
              국가 토글하기
            </button>

            <hr />

            <h2>숫자를 입력해주세요</h2>
            <input
              type="number"
              value={number}
              onChange={(e) => setNumber(e.target.value)}
            />
          </>
          // number만 바뀌고 의존성배열에 [location] 을 걸어주었지만
          // App 컴포넌트가 재렌더링 되기 때문에 location 객체도 새로 생성된다.
          // 그래서 이전 location과 새로운 location이 다르다고 판단해서 useEffect는 의존성이 바뀌었다고 판단함.
          // 그러므로 의존성 배열에 location을 걸어주어도 useEffect 가 실행된다.
          // 따라서 이런 경우에 불필요한 재렌더링이 일어나기 때문에 useMemo를 사용해주는 것이 좋다.
          // 그러니까 useMemo의 역할은 location 객체가 불필요하게 새로 만들어지는 것을 막는 것.
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
