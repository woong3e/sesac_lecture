<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인터랙션</title>
    <style>
      .button {
        display: inline-block;
        padding: 15px 30px;
        background-color: tomato;
        margin: 20px;
        color: black;
        text-decoration: none;
        border-radius: 10px;
        transition: all 0.3s ease-in-out; /* 모든 속성에 대해 0.3초 동안 부드럽게 변화 */
      }
      /* hover : 마우스를 올렸을 때 */
      .button:hover {
        background-color: lightgreen;
        transform: translateY(-10px);
        box-shadow: 0 5px 10px darkblue;
        opacity: 0.7;
      }
      /* active : 클릭시 */
      .button:active {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <h1>마우스 반응과 부드러운 효과</h1>
    <p>
      가상 클래스 선택자(:hover)와 트랜지션(transition)을 이용해 인터랙션 할 수
      있다.
    </p>

    <a href="#" class="button">마우스를 올려보세요!</a>
  </body>
</html>
