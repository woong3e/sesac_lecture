<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글자와 상자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grandiflora+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <style>
      body {
        font-family: 'Grandiflora One', cursive;
      }

      h1 {
        font-weight: 900;
        text-align: center;
      }

      .box {
        background-color: tomato;
        width: 300px;
        height: 150px;
        border: 2px dashed aqua;
        padding: 20px; /* 테두리 안쪽 여백 */
        margin: 20px; /* 테두리 바깥쪽 여백 */
        box-sizing: border-box;
        /* box-sizing 속성은 요소의 크기를 계산할 때 padding과 border를 포함할지 여부를 결정합니다.
        기본값은 content-box이며, border-box로 설정하면 padding과 border를 포함한 크기가 지정됩니다. 
        입력창이나 카드가 부모 영역밖으로ㅡ 튀어나가는 문제를 줄일 수 있다. */
      }

      .rounded-box {
        background-color: aqua;
        color: tomato;
        padding: 10px;
        margin: 10px;
        border-radius: 15px; /* 모서리 둥글게 */
        box-shadow: 15px 15px 50px tomato; /* 그림자 */
      }

      .responsive-box {
        background-color: greenyellow;
        width: 90%;
        max-width: 300px;
        margin: 30px auto;
      }
    </style>
  </head>

  <body>
    <h1>글자와 상자 꾸미기</h1>
    <p>
      CSS의 핵심은 글자를 보기 좋게 만들고, 각 요소가 차지하는 '상자'의 모양과
      간격을 조절하는 것이다.
    </p>

    <div class="box">
      이것은 기본 상자입니다. 안쪽 여백(padding), 테두리(border), 바깥
      여백(margin)을 가지고 있습니다.
    </div>

    <div class="rounded-box">
      이것은 모서리가 둥글고 그림자가 있는 상자입니다.
    </div>

    <div class="responsive-box">
      이것은 최대 너비와 box-sizing을 적용한 반응형 상자입니다.
    </div>
  </body>
</html>
