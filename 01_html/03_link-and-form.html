<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>링크와 폼</title>
  </head>
  <body>
    <h1>하이퍼링크로 페이지 연결하기</h1>

    <h2>다른 웹사이트로 이동하기</h2>
    <ul>
      <li>
        <a href="https://www.google.com">google로 이동</a>
      </li>
      <li>
        <a href="https://www.naver.com" target="_blank"
          >naver로 이동(새탭생성)</a
        >
      </li>
    </ul>

    <h2>같은 폴더의 다른 파일로 이동하기</h2>
    <ul>
      <li><a href="01_text-and-list.html">01_text-and-list.html</a></li>
      <li><a href="02_table-and-media.html">02_table-and-media.html</a></li>
    </ul>

    <h2>페이지 내부의 특정 위치로 이동하기</h2>
    <p><a href="#guestbook">페이지 하단의 방명록으로 바로가기</a></p>
    <br />
    <br />
    <br />
    <br />
    <br />
    <hr />

    <h1>form으로 사용자 정보 입력기</h1>
    <!-- form 태그는 사용자가 입력한 데이터를 서버로 보내는 창구 역할을 한다 -->
    <form action="#" method="post">
      <fieldset>
        <legend id="guestbook">방명록 작성</legend>
        <!-- 접근성 향상을 위해 label과 input을 연결해준다. -->
        <!-- input의 name 속성은 서버로 데이터를 보낼때 사용되는 이름 -->
        <label for="user_id">아이디:</label>
        <input
          id="user_id"
          name="userId"
          type="text"
          placeholder="아이디를 입력하세요"
          required
        />
        <label for="user_pw">비밀번호:</label>
        <input id="user_pw" name="userPw" type="password" />

        <label for="user_age">나이:</label>
        <input type="number" id="user_age" name="userAge" />

        <label for="user_track">희망 분야:</label>
        <!-- select는 여러 선택지 중 하나를 고르는 드롭다운 입력 요소이다.
         각각의 선택지는 option 태그로 작성한다. -->
        <select name="track" id="user_track">
          <option value="">희망 분야 선택</option>
          <option value="frontend">프론트엔드</option>
          <option value="backend">백엔드</option>
          <option value="ai">AI</option>
        </select>

        <p>가입 경로 (하나만 선택):</p>
        <input
          type="radio"
          id="route_internet"
          name="route"
          value="internet"
          checked
        />
        <label for="route_internet">인터넷 검색</label>
        <input type="radio" id="route_friend" name="route" value="friend" />
        <label for="route_friend">친구 추천</label>

        <p>관심 분야 (복수 선택 가능):</p>
        <input type="checkbox" id="hobby_html" name="hobby" value="html" />
        <label for="hobby_html">HTML</label>
        <input type="checkbox" id="hobby_css" name="hobby" value="css" />
        <label for="hobby_css">CSS</label>
        <input type="checkbox" id="hobby_js" name="hobby" value="javascript" />
        <label for="hobby_js">JavaScript</label>
        <br />

        <label for="memo">하고 싶은 말:</label>
        <textarea id="memo" name="memo" rows="4" cols="50"></textarea>
        <br />

        <button type="submit">작성 완료</button>
        <button type="reset">초기화</button>
      </fieldset>
    </form>
  </body>
</html>
