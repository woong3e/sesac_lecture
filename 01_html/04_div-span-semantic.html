<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>레이아웃과 시멘틱</title>
    <style>
      div,
      span {
        border: 1px solid blue;
        padding: 5px;
        margin: 1px;
      }
    </style>
  </head>
  <body>
    <h1>영역을 나누는 기본 태그: div와 span</h1>
    <h2>div 태그(블럭 레벨 요소)</h2>
    <!-- div는 블럭 레벨 요소로, 새로운 줄에서 시작하고 끝나는 요소이다. -->
    <div>첫 번째 div</div>
    <div>두 번째 div</div>

    <h2>span 태그(인라인 레벨 요소)</h2>
    <!-- span은 인라인 레벨 요소로, 새로운 줄에서 시작하지 않고 텍스트 크기만큼의 공간만 차지한다. -->
    <span>첫 번째 span 태그</span>
    <span>두 번째 span 태그</span>

    <hr />

    <h2>시멘틱 태그: 의미를 담아 영역을 나눈다.</h2>
    <!-- header : 페이지나 섹션의 헤더를 나타냄 -->
    <header>
      <h1>My Profile Page</h1>
      <nav>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>
    <!-- main : 페이지나 섹션의 핵심 콘텐츠를 나타냄 -->
    <main>
      <section id="about">
        <h2>소개</h2>
        <p>안녕하세요. 저는 장건웅입니다.</p>
      </section>
      <section id="contact">
        <h2>보유 기술</h2>
        <p>HTML, CSS, JavaScript</p>
      </section>
    </main>

    <!-- footer : 페이지나 섹션의 푸터를 나타냄 -->
    <footer>
      <p>&copy; 2026 My Profile Page. All rights reserved.</p>
    </footer>
  </body>
</html>
