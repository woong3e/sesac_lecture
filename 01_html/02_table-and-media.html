<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>표와 미디어</title>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <!-- 표 전체를 감싸는 태그 -->
    <table>
      <!-- caption: 표의 제목 또는 설명 -->
      <caption>
        웹 개발 스터디 시간표
      </caption>
      <!-- thead: 표의 제목 행들을 묶는 영역 -->
      <tbody>
        <thead>
          <tr>
            <!-- th: 표의 제목 셀 -->
            <!-- th 태그는 표의 제목 셀을 나타내며, 기본적으로 굵은 글씨와 가운데 정렬이 적용됩니다. -->
            <th>시간</th>
            <th>월요일</th>
            <th>화요일</th>
            <th>수요일</th>
          </tr>
        </thead>
      </tbody>
      <tbody>
        <tr>
          <td>1교시</td>
          <!-- rowspan : 세로로 병합 -->
          <td rowspan="2">html 기초</td>
          <td>css 기초</td>
          <td>javascript 기초</td>
        </tr>
        <tr>
          <td>2교시</td>
          <!-- colspan : 가로로 병합 -->
          <td colspan="2">미니 프로젝트</td>
        </tr>
      </tbody>
    </table>

    <hr />

    <h1>미디어로 페이지 꾸미기</h1>
    <h2>이미지 넣기</h2>
    <img src="sample/image/flower2.PNG" alt="꽃" width="300" height="200" />

    <figure>
      <img
        src="sample/image/city1.PNG"
        alt="도시 풍경 사진"
        width="500"
        height="300"
      />
      <figcaption>도시 풍경 사진입니다.</figcaption>
    </figure>

    <h2>오디오 넣기</h2>
    <audio src="sample/audio/major.mp3" controls></audio>

    <h2>비디오 넣기</h2>
    <video src="sample/video/video1.mp4" controls></video>
  </body>
</html>
